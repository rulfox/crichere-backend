name: crichere_flutter
description: "Crichere - India-first cricket league auction SaaS platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^2.5.1
  
  # Networking
  dio: ^5.4.1
  retrofit: ^4.4.1
  eventsource: ^0.4.0
  
  # Database
  drift: ^2.16.0
  sqlite3: ^2.9.0
  sqlite3_flutter_libs: ^0.5.24
  
  # Navigation
  auto_route: 10.1.0
  
  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  
  # Auth & Storage
  flutter_secure_storage: ^10.0.0
  
  # Notifications & Messaging
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^18.0.1
  
  # UI & Utilities
  google_fonts: ^4.0.4
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0
  connectivity_plus: ^7.1.1
  permission_handler: ^12.0.1
  intl: ^0.20.2
  url_launcher: ^6.2.5
  image_picker: ^1.0.7
  file_picker: ^11.0.2
  share_plus: ^12.0.2
  pdf: ^3.10.10
  screenshot: ^3.0.0
  logger: ^2.0.2
  path: ^1.8.3
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code Generation
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  retrofit_generator: ^10.2.5
  drift_dev: ^2.16.0
  auto_route_generator: 10.1.0
  freezed: ^2.5.2
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
