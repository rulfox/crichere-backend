name: crichere_flutter
description: "Crichere - India-first cricket league auction SaaS platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^4.0.2
  flutter_hooks: ^0.21.0
  hooks_riverpod: ^3.0.3

  # Networking
  dio: ^5.4.1
  retrofit: ^4.9.0

  # Database
  drift: ^2.28.0
  sqlite3: ^2.9.0
  sqlite3_flutter_libs: ^0.6.0+eol

  # Navigation
  auto_route: ^11.1.0

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Auth & Storage
  flutter_secure_storage: ^10.0.0

  # Notifications & Messaging
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^18.0.1

  # UI & Utilities
  google_fonts: ^8.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0
  connectivity_plus: ^7.1.1
  permission_handler: ^12.0.1
  intl: ^0.20.2
  url_launcher: ^6.2.5
  image_picker: ^1.0.7
  file_picker: ^12.0.0-beta.3
  share_plus: ^13.1.0
  pdf: ^3.10.10
  screenshot: ^3.0.0
  logger: ^2.0.2
  path: ^1.8.3
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.8
  riverpod_generator: ^4.0.3
  retrofit_generator: ^10.2.1
  drift_dev: ^2.28.3
  auto_route_generator: ^10.4.0
  freezed: ^3.2.5
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
