<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="India's cricket league auction platform.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Crichere">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon: SVG preferred by modern browsers, PNG as fallback. ?v= busts browser cache. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2"/>
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2"/>

  <title>Crichere</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #060C1A;
    }

    #splash {
      position: fixed;
      inset: 0;
      background: #060C1A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .splash-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Cricket ball SVG icon */
    .splash-ball {
      width: 48px;
      height: 48px;
    }

    .splash-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 36px;
      font-weight: 700;
      color: #F1F5F9;
      letter-spacing: -0.5px;
    }

    .splash-title span {
      color: #F59E0B;
    }

    /* Gold spinner */
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(245, 158, 11, 0.2);
      border-top-color: #F59E0B;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Splash shown while Flutter initialises -->
  <div id="splash">
    <div class="splash-logo">
      <svg class="splash-ball" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="22" fill="#DC2626" stroke="#991B1B" stroke-width="1.5"/>
        <!-- seam lines -->
        <path d="M24 2 Q30 12 30 24 Q30 36 24 46" stroke="#F1F5F9" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M24 2 Q18 12 18 24 Q18 36 24 46" stroke="#F1F5F9" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M6 16 Q16 18 24 18 Q32 18 42 16" stroke="#F1F5F9" stroke-width="1" fill="none" stroke-linecap="round"/>
        <path d="M6 32 Q16 30 24 30 Q32 30 42 32" stroke="#F1F5F9" stroke-width="1" fill="none" stroke-linecap="round"/>
      </svg>
      <span class="splash-title">Cric<span>here</span></span>
    </div>
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Hide splash once Flutter paints its first frame
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.classList.add('hidden');
        setTimeout(function () { splash.remove(); }, 450);
      }
    });
  </script>
</body>
</html>
