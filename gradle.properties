# Increase max heap size to reduce in-memory cache misses
# Recommended for projects with many files or Spring Boot applications
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable parallel execution and configuration caching for better performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
