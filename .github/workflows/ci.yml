name: CI

on:
  push:
    branches: [main]
    paths:
      - 'crichere-backend/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew :crichere-backend:test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: crichere-backend/build/reports/tests/

  build:
    name: Build & Docker
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew :crichere-backend:bootJar --no-daemon -x test

      - name: Build Docker image
        run: docker build -t crichere-backend:${{ github.sha }} -t crichere-backend:latest .
