services:
  postgres:
    image: postgres:16-alpine
    container_name: crichere-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=crichere
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: crichere-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
