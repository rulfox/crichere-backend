spring:
  jpa:
    # show-sql duplicates the org.hibernate.SQL logger output. Leave it off and use
    # the logger instead when you need to trace queries.
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    ignore-migration-patterns: "*:Missing"

logging:
  level:
    com.crichere: DEBUG
    org.springframework.security: DEBUG
    # TimerExpiryScheduler polls the auctions table every second; at DEBUG that
    # floods the log. Flip back to DEBUG locally when investigating a SQL issue.
    org.hibernate.SQL: INFO

crichere:
  cors:
    allowed-origins: "*"
