spring:
  application:
    name: crichere-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    async:
      request-timeout: -1
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:crichere}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgres}
    hikari:
      # SSE keeps a JPA EntityManager open for the lifetime of the request, so the
      # pool has to absorb the concurrent SSE traffic + regular API traffic.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 30000
      pool-name: crichere-hikari
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:400}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true

crichere:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000} # 1 hour
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
  s3:
    region: ${AWS_REGION:ap-south-1}
    bucket: ${S3_BUCKET:crichere-assets}
  sms:
    msg91-auth-key: ${MSG91_AUTH_KEY:dummy}
    msg91-template-id: ${MSG91_TEMPLATE_ID:dummy}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:55321,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
