spring:
  flyway:
    ignore-migration-patterns: "*:missing"
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:crichere}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
  data:
    redis:
      # Railway exposes REDIS_URL (preferred) as well as REDISHOST / REDISPORT / REDISPASSWORD.
      # Use the full URL so authentication and any port overrides are handled automatically.
      url: ${REDIS_URL:redis://${REDISHOST:localhost}:${REDISPORT:6379}}
      # Explicit password fallback in case REDIS_URL is not set by the addon.
      password: ${REDISPASSWORD:}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

crichere:
  jwt:
    secret: ${JWT_SECRET}
  s3:
    bucket: ${S3_BUCKET}
  sms:
    msg91-auth-key: ${MSG91_AUTH_KEY}
    msg91-template-id: ${MSG91_TEMPLATE_ID}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
