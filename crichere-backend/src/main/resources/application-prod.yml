server:
  # Trust Railway's reverse-proxy X-Forwarded-Proto header so Spring sees HTTPS
  # as the request scheme. Without this, Spring's CORS filter compares
  # "https://api.crichere.com" (Origin) vs "http://..." (internal scheme) and
  # treats every same-origin POST as cross-origin → 403 "Invalid CORS request".
  forward-headers-strategy: FRAMEWORK

spring:
  flyway:
    ignore-migration-patterns: "*:missing"
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:crichere}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
  data:
    redis:
      # Build a URL that embeds the password so auth works whether Railway exposes
      # REDIS_URL (full URL with credentials) or separate REDISHOST/REDISPORT/REDISPASSWORD.
      # Format: redis://:PASSWORD@HOST:PORT  (colon-before-password is required by URI spec)
      url: ${REDIS_URL:redis://:${REDISPASSWORD:}@${REDISHOST:localhost}:${REDISPORT:6379}}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

crichere:
  jwt:
    secret: ${JWT_SECRET}
  s3:
    bucket: ${S3_BUCKET}
  sms:
    msg91-auth-key: ${MSG91_AUTH_KEY}
    msg91-template-id: ${MSG91_TEMPLATE_ID}
  cors:
    # Comma-separated list of allowed web origins for the Flutter web frontend.
    # Add your Railway preview URL here too during development if needed.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://crichere.com,https://www.crichere.com}
