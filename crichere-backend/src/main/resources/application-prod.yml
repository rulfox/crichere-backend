spring:
  jpa:
    show-sql: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:crichere}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:postgres}}
    hikari:
      maximum-pool-size: 20
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDISHOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDISPORT:6379}}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

crichere:
  jwt:
    secret: ${JWT_SECRET}
  s3:
    bucket: ${S3_BUCKET}
  sms:
    msg91-auth-key: ${MSG91_AUTH_KEY}
    msg91-template-id: ${MSG91_TEMPLATE_ID}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
