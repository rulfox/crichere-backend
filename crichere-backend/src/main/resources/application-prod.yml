spring:
  flyway:
    ignore-missing-migrations: true
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:crichere}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
  data:
    redis:
      host: ${REDISHOST:localhost}
      port: ${REDISPORT:6379}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

crichere:
  jwt:
    secret: ${JWT_SECRET}
  s3:
    bucket: ${S3_BUCKET}
  sms:
    msg91-auth-key: ${MSG91_AUTH_KEY}
    msg91-template-id: ${MSG91_TEMPLATE_ID}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
